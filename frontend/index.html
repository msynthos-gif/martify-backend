<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Martify Collection </title>
  <title>Martify Collection | Martify Online Shopping &amp; Marketplace</title>

  <!-- Favicon & Mobile Touch Icons -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Search Engine & SEO Meta Tags -->
  <meta name="description"
    content="Explore Martify Collection – your premier online shopping destination and multi-vendor marketplace. Shop authentic fashion, streetwear, footwear, outerwear, and discover verified independent sellers on Martify." />
  <meta name="keywords"
    content="Martify Collection, MartifyMartify online shopping, Martify marketplace, Martify shopping, online marketplace, multi-vendor ecommerce, shop fashion online, streetwear collection, trending apparel" />
  <meta name="author" content="Martify Collection" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://martifycollection.com/" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://martifycollection.com/" />
  <meta property="og:site_name" content="Martify Collection" />
  <meta property="og:title" content="Martify Collection | Martify Online Shopping &amp; Marketplace" />
  <meta property="og:description"
    content="Discover Martify Collection  different sellers, endless discoveries. Shop trending fashion, streetwear, curated styles, and official marketplace collections with fast delivery." />
  <meta property="og:image" content="https://martifycollection.com/logo.png" />
  <meta property="og:image:alt" content="Martify Collection Online Marketplace" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://martifycollection.com/" />
  <meta name="twitter:title" content="Martify Collection | Martify Online Shopping &amp; Marketplace" />
  <meta name="twitter:description"
    content="Discover Martify Collection  different sellers, endless discoveries. Shop trending fashion, streetwear, and curated marketplace goods." />
  <meta name="twitter:image" content="https://martifycollection.com/logo.png" />
  <meta name="twitter:image:alt" content="Martify Collection" />

  <!-- Theme & Mobile Presentation -->
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Schema.org JSON-LD Structured Data for Google Search Console & Rich Snippets -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://martifycollection.com/#website",
          "url": "https://martifycollection.com/",
          "name": "Martify Collection",
          "alternateName": ["Martify", "Martify Marketplace", "Martify Online Shopping"],
          "description": "Martify Collection is a premier multi-vendor marketplace offering curated fashion, apparel, and goods from verified independent sellers.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://martifycollection.com/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://martifycollection.com/#organization",
          "name": "Martify Collection",
          "alternateName": "Martify",
          "url": "https://martifycollection.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://martifycollection.com/logo.png"
          }
        }
      ]
    }
    </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-slate-50 text-slate-900 antialiased font-sans w-full max-w-[100vw] overflow-x-hidden">
  <div id="root" class="w-full max-w-[100vw] overflow-x-hidden"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
